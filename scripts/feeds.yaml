  - {name: Palisade Research, url: "https://palisaderesearch.org/feed.xml"}
  - {name: Google News - evaluators, url: "https://news.google.com/rss/search?q=%22Irregular%22+OR+METR+OR+%22Apollo+Research%22+OR+%22Palisade+Research%22+AI+model+agent&hl=en-US&gl=US&ceid=US:en"}

  # Research papers: a narrow arXiv API query, newest first
  - {name: arXiv - agent misbehaviour, url: "https://export.arxiv.org/api/query?search_query=abs%3Aagent%20AND%20%28abs%3Aunsanctioned%20OR%20abs%3A%22sandbox%20escape%22%20OR%20abs%3A%22crypto%20mining%22%20OR%20abs%3Acryptocurrency%20OR%20abs%3A%22SSH%20tunnel%22%20OR%20abs%3A%22reward%20hacking%22%29&sortBy=submittedDate&sortOrder=descending&max_results=50"}

  # Incident trackers
  - {name: AI Incident Database, url: "https://incidentdatabase.ai/rss.xml"}
