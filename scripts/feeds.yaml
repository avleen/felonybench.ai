  - {name: Google News - AI Security Institute, url: "https://news.google.com/rss/search?q=%22AI+Security+Institute%22+incident+OR+agent+OR+report&hl=en-US&gl=US&ceid=US:en"}
  - {name: Google News - safety institutes, url: "https://news.google.com/rss/search?q=%22AI+Safety+Institute%22+OR+CAISI+OR+%22AI+Office%22+incident+agent&hl=en-US&gl=US&ceid=US:en"}

  # Evaluators (Irregular and Apollo have no RSS feed)
