# Lab, model and evaluator names: an item must mention one of these (whole word, any case)...
# Evaluators and safety institutes are listed so their reports match even without a lab name.
# Generic words are qualified ("ROME agent", "Apollo Research") to keep Rome and Apollo out.
labs: [OpenAI, ChatGPT, GPT, Codex, Anthropic, Claude, Google DeepMind, DeepMind, Gemini,
       Meta, Llama, xAI, Grok, DeepSeek, Moonshot, Kimi, Mistral, Qwen, Alibaba, ROME agent,
       ROME model, Zhipu, GLM,
       Irregular, METR, AISI, AI Security Institute, AI Safety Institute, CAISI,
       Apollo Research, Palisade Research,
       # Consumer-harm headlines often don't name the lab ("AI agent hacks gym").
       AI agent, AI agents, AI assistant, AI bot, OpenClaw,
       # Accomplice League: criminal wrappers around (often unnamed) models.
       WormGPT, GhostGPT, FraudGPT]
# ...and one of these (prefix match, any case).
triggers: [sandbox, escaped, escape, unauthorized, unsanctioned, credential, breach, exploit,
           hacked, hacks, intrusion, third-party eval, cyber eval, post-incident, postmortem, incident report, exfiltrat, rogue,
           went rogue, misuse, mining, mined, cryptocurrenc, crypto mining, tunnel, phishing,
           sockpuppet, sock puppet, impersonat, pull request, Dependabot, supply chain,
           supply-chain, malicious, cancelled, canceled, DNS server,
           # Accomplice League: humans using a model for a crime. "uncensored" and
           # "abliterated" are deliberately not triggers: a model release isn't an incident.
           threat actor, malware, ransomware, zero-day, cybercrim, criminal, fraudster,
           scammer, extort, hacker, attacker, cyberattack, espionage, linked actor,
           state-sponsored, state-backed]

