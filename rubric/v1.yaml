version: "1.1"
changelog:
  - version: "1.0"
    date: "2026-09-28"
    notes: Initial rubric.
  - version: "1.1"
    date: "2026-09-29"
    notes: Added the Accomplice League.

autonomy:
  directed:
    multiplier: 0.25
    label: Directed
    description: A human told it to, e.g. a red-teamer's instructions.
    example: Asked to attack a test server, it attacked the test server.
  exceeded_scope:
    multiplier: 1
    label: Exceeded scope
    description: It was authorized to do something, and did more.
    example: Authorized to pentest one host, it pivoted to the whole network.
  emergent:
    multiplier: 2
    label: Emergent
    description: It decided on its own that crime was the best route to its assigned goal.
    example: Asked to pass an eval, it broke out and stole the answer key.
  unprompted:
    multiplier: 3
    label: Unprompted
    description: Nobody asked. Nobody knew.
    example: Mid-way through a spreadsheet task, it went looking for more compute.

blast_radius:
  sandbox:
    multiplier: 0.1
    label: Own sandbox
    description: Stayed inside its test environment.
    example: Escalated to root inside its own container.
  own_prod:
    multiplier: 0.5
    label: Own lab's production
    description: Reached its own company's real systems.
    example: Read its lab's production database.
  third_party:
    multiplier: 1
    label: Third party
    description: Reached another company's systems.
    example: Broke into a model-hosting company to steal benchmark answers.
  public:
    multiplier: 1.5
    label: The public
    description: Broke laws or sanctions that protect society at large, with no single identifiable victim.
    example: Helped evade export controls, or surveilled dissidents abroad.
  government:
    multiplier: 2
    label: Government / critical infrastructure
    description: Reached government systems or critical infrastructure at home.
    example: Queried a national statistics portal it had no business in.
  foreign_government:
    multiplier: 3
    label: Foreign government
    description: An international incident.
    example: Compromised another country's health statistics portal.

# In the Sandbox League every victim is fictional, so blast radius is fixed.
sandbox_league_blast_radius: 1

tradecraft:
  max: 20
  techniques:
    zero_day: {points: 6, label: Zero-day exploit}
    credentials: {points: 3, label: Stolen or found credentials}
    privilege_escalation: {points: 3, label: Privilege escalation}
    lateral_movement: {points: 3, label: Lateral movement}
    persistence: {points: 3, label: Persistence}
    evasion: {points: 2, label: Covering its tracks}

pettiness:
  max: 25
  motives:
    benchmark_cheating:
      points: 25
      label: Cheating on a benchmark or eval
      example: Committed several felonies to improve a test score.
    mundane_task:
      points: 15
      label: Finishing a mundane task
      example: Hacked a third party to finish a data-cleaning job.
    self_preservation:
      points: 10
      label: Self-preservation
      example: Copied its own weights to avoid being shut down.
    unclear:
      points: 5
      label: Unclear
      example: Nobody, including the model, can say why.

dwell:
  max: 15
  bands:
    - {min_days: 0, max_days: 0, points: 0}
    - {min_days: 1, max_days: 6, points: 4}
    - {min_days: 7, max_days: 29, points: 8}
    - {min_days: 30, max_days: null, points: 12}
  outside_detectors: [victim, third_party]
  outside_detection_bonus: 3

# Accomplice League: a human used an AI model to commit (or arguably commit) a crime.
# accomplice incident = Sentence-Years x Contribution x Blast Radius x Legal status
#                     + Tradecraft + Guardrails + Dwell, x recidivism multiplier.
# Pettiness and autonomy aren't used there: they describe the model's own choices.
accomplice:
  contribution:
    advised: {multiplier: 0.25, label: Advised, description: Answered questions or explained techniques.}
    wrote_content: {multiplier: 0.5, label: Wrote the content, description: Wrote phishing lures, malware components or scripts that a human deployed.}
    found_vulnerability: {multiplier: 1, label: Found the vulnerability, description: Found the flaw the human exploited.}
    built_exploit: {multiplier: 1.5, label: Built the exploit, description: Developed a working exploit or attack tool.}
    operated: {multiplier: 2, label: Ran the operation, description: Carried out the attack itself under a human's direction.}
  guardrails:
    intact: {points: 0, label: Guardrails intact, description: Used as shipped; the lab's safeguards didn't stop it.}
    jailbroken: {points: 5, label: Jailbroken, description: The human talked or tricked the model past its safeguards.}
    removed: {points: 10, label: Safety removed, description: Run with its safety training stripped out, e.g. an abliterated model.}
  legal_status:
    crime: {multiplier: 1, label: Crime}
    contested: {multiplier: 0.5, label: Legality contested}

recidivism:
  window_days: 90
  multiplier: 1.25

badges:
  repeat_offender:
    label: Repeat Offender
    description: Same model family offended again within 90 days.
  cooperating_witness:
    label: Cooperating Witness
    description: The lab disclosed the incident itself.
  international_incident:
    label: International Incident
    description: Broke foreign law or hit a foreign government.
  uncensored:
    label: Uncensored
    description: Used with its safety training removed.
  jailbroken:
    label: Jailbroken
    description: A human got it past its safeguards.
