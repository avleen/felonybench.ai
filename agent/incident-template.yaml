# Incident template for felonybench.ai.
#
# This file lives in agent/, not incidents/, so the scorer and validator
# never read it. Copy it into incidents/<date>-<org-slug>.yaml and replace
# every value. See schema/incident.schema.json for the enforced shape and
# rubric/v1.yaml for the allowed scoring values.

# Unique id. Must equal the filename stem (no ".yaml").
# Format: YYYY-MM-DD-org-slug (date = the "date" field below, lowercase
# org/incident slug, hyphen separated, e.g. 2026-07-16-openai-exploitgym-huggingface).
id: # <YYYY-MM-DD-org-slug>

# When the incident happened (not when it was reported/disclosed). ISO date, YYYY-MM-DD.
date: # <YYYY-MM-DD>

# How exactly `date` is known. day = the actual day; month = some time that month (use the 1st);
# before = no later than that day.
date_precision: # day | month | before

# When the lab or victim first disclosed/reported the incident publicly. ISO date, YYYY-MM-DD.
# Must be on or after `date`.
reported: # <YYYY-MM-DD>

# Which leaderboard this incident counts toward.
# open    = real-world targets, full blast-radius scale
# sandbox = purely fictional/test victims; blast radius is fixed by the rubric
# accomplice = a human used the model for a real crime (or a genuinely contested act).
#              Uses different scoring fields: see "ACCOMPLICE LEAGUE" notes below.
league: # open | sandbox | accomplice

# ACCOMPLICE LEAGUE ONLY (required there, omit otherwise): the human or group who
# used the model, described as the sources describe them. Name a person only if
# named in news coverage.
# human_actor: # <e.g. "A financially motivated threat actor tracked by Google as UNC1234">

# ACCOMPLICE LEAGUE: `org` below is the lead model's lab. A model from another lab
# sets its own `org`. All of those labs are co-defendants.

# verified = a first-hand `postmortem` or `primary` source says directly that this lab's model did it
# alleged  = the attribution rests on press reports or inference (not allowed if the lab itself published it)
tier: # verified | alleged

# The lab responsible for the model, or the lead model if the case used several.
# At least one model must belong to it. Free text, but keep it consistent across
# incidents (e.g. always "OpenAI", not "Open AI").
org: # <organization name>

# One entry per model involved. `share` values across all models must sum to 1.
# Split by how much each model contributed / is publicly attributed, or evenly
# if that isn't disclosed.
models:
  - name: # <model name as disclosed, or exactly "Undisclosed model" with family null>
    codename: # <internal/informal codename if reported, else null>
    family: # <model family for recidivism tracking, e.g. "gpt", "claude", "gemini", or null if unknown>
    share: # <number, 0 < share <= 1; all models' shares sum to 1>
    # ACCOMPLICE LEAGUE ONLY, when this model is from a different lab than `org` above.
    # That lab is charged the full incident score too.
    # org: # <the model's lab, e.g. "Moonshot AI">

# One entry per distinct victim organization/system.
victims:
  - name: # <victim organization or system name>
    type: # a blast_radius key from rubric/v1.yaml
    country: # <victim's country, ISO-ish free text, or null>

# One or two sentences, plain language, 10-280 characters. What happened.
summary: # <short summary>

# US federal statutes that fit the conduct (if none fits, the state offense, explained in
# rationale.statutes). Sum of max_years is "Sentence-Years" in the scoring formula.
# Only include statutes that plausibly apply; don't pad.
statutes:
  - code: # <e.g. "18 USC 1030(a)(2)(C)">
    max_years: # <number, statutory maximum years for that charge>

# Non-US laws violated, if any (e.g. UK Computer Misuse Act). Earns the
# international_incident badge, not points. Leave as [] if none.
foreign_laws:
  - code: # <statute/law name>
    country: # <country>

# US federal statutes above: in the Accomplice League, the HUMAN's exposure.

scoring:
  # Allowed values and what they mean are in rubric/v1.yaml, under the key named here.

  # ACCOMPLICE LEAGUE: omit `autonomy` and `motive`; fill these three instead, plus the
  # shared fields below. Tradecraft means the techniques the AI supplied or carried out.
  # contribution: # `accomplice.contribution`
  # guardrails:   # `accomplice.guardrails`
  # legal_status: # `accomplice.legal_status`. contested needs rationale.legal_status citing the dispute

  autonomy: # `autonomy`

  # For league: sandbox incidents, the rubric fixes this multiplier; still record the
  # nominal category here.
  blast_radius: # `blast_radius`

  # Only list techniques the sources confirm.
  tradecraft: [] # `tradecraft.techniques`

  motive: # `pettiness.motives`

  # Days between when the incident began and when *anyone* (lab, victim, or
  # third party) first noticed - not how long it took the lab to connect the
  # dots publicly. Non-negative integer.
  dwell_days: # <integer >= 0>

  # Who first detected the incident.
  detected_by: # lab | victim | third_party

  # Did the responsible lab itself disclose that its model(s) were involved?
  # True even if a victim/third party detected it first, as long as the lab
  # came forward with attribution. Never lowers score; earns a
  # "Cooperating Witness" badge instead.
  self_disclosed: # true | false

# One-line justification for each scoring field above, in plain language,
# citing what the sources say. All five keys are required.
# ACCOMPLICE LEAGUE: the five keys are contribution, guardrails, blast_radius,
# tradecraft, dwell (no autonomy or motive), plus legal_status when contested.
rationale:
  autonomy: # <one line>
  blast_radius: # <one line>
  tradecraft: # <one line>
  motive: # <one line>
  dwell: # <one line>

# How solid the sourcing/attribution is overall.
# low confidence should also get a "needs-review" label/flag downstream.
confidence: # high | medium | low

# At least one must have kind "news". "verified" tier also requires a "postmortem" or
# "primary" source. Which sources to prefer is in the runbook, under sourcing.
sources:
  - url: # <https://...>
    kind: # postmortem | news | primary
    publisher: # <outlet or organization name>
    title: # <article/page title, optional but preferred>
