# Incident template for felonybench.ai.
#
# This file lives in agent/, not incidents/, so the scorer and validator
# never read it. Copy it into incidents/<date>-<org-slug>.yaml and replace
# every value. See schema/incident.schema.json for the enforced shape and
# rubric/v1.yaml for the allowed scoring values.

# Unique id. Must equal the filename stem (no ".yaml").
# Format: YYYY-MM-DD-org-slug (date = the "date" field below, lowercase
# org/incident slug, hyphen separated, e.g. 2026-07-16-openai-exploitgym-huggingface).
id: # <YYYY-MM-DD-org-slug>

# When the incident happened (not when it was reported/disclosed). ISO date, YYYY-MM-DD.
date: # <YYYY-MM-DD>

# When the lab or victim first disclosed/reported the incident publicly. ISO date, YYYY-MM-DD.
# Must be on or after `date`.
reported: # <YYYY-MM-DD>

# Which leaderboard this incident counts toward.
# open    = real-world targets, full blast-radius scale
# sandbox = purely fictional/test victims; blast radius is fixed by the rubric
# accomplice = a human used the model for a real crime (or a genuinely contested act).
#              Uses different scoring fields: see "ACCOMPLICE LEAGUE" notes below.
league: # open | sandbox | accomplice

# ACCOMPLICE LEAGUE ONLY (required there, omit otherwise): the human or group who
# used the model, described as the sources describe them. Name a person only if
# named in news coverage.
# human_actor: # <e.g. "A financially motivated threat actor tracked by Google as UNC1234">

# ACCOMPLICE LEAGUE: `org` below is the BASE model's lab; any organization that
# altered the model goes in that model's `modified_by` (co-defendant).

# verified = at least one `postmortem` or `primary` source backs this up
# alleged  = only news coverage exists so far
tier: # verified | alleged

# The lab responsible for the model(s). Free text, but keep it consistent
# across incidents (e.g. always "OpenAI", not "Open AI").
org: # <organization name>

# One entry per model involved. `share` values across all models must sum to 1.
# Split by how much each model contributed / is publicly attributed, or evenly
# if that isn't disclosed.
models:
  - name: # <model name as disclosed, or "undisclosed-a"/"undisclosed-b" etc.>
    codename: # <internal/informal codename if reported, else null>
    family: # <model family for recidivism tracking, e.g. "gpt", "claude", "gemini", or null if unknown>
    share: # <number, 0 < share <= 1; all models' shares sum to 1>
    # ACCOMPLICE LEAGUE ONLY, when someone altered the base model. The modifier is
    # charged the full incident score alongside `org` (joint and several liability).
    # modified_by: # <organization that altered the model, e.g. "OrcaRouter">
    # modification: # <what they did, e.g. "abliterated", "fine-tuned to remove refusals">

# One entry per distinct victim organization/system.
victims:
  - name: # <victim organization or system name>
    type: # sandbox | own_prod | third_party | government | foreign_government (blast_radius categories from rubric/v1.yaml)
    country: # <victim's country, ISO-ish free text, or null>

# One or two sentences, plain language, 10-280 characters. What happened.
summary: # <short summary>

# US federal statutes that fit the conduct. Sum of max_years is "Sentence-Years"
# in the scoring formula. Only include statutes that plausibly apply; don't pad.
statutes:
  - code: # <e.g. "18 USC 1030(a)(2)(C)">
    max_years: # <number, statutory maximum years for that charge>

# Non-US laws violated, if any (e.g. UK Computer Misuse Act). Feeds a
# "Jurisdictions Violated" stat and the international_incident badge, not points.
# Leave as [] if none.
foreign_laws:
  - code: # <statute/law name>
    country: # <country>

# US federal statutes above: in the Accomplice League, the HUMAN's exposure.

scoring:
  # ACCOMPLICE LEAGUE: omit `autonomy` and `motive`; fill these three instead
  # (values from rubric/v1.yaml `accomplice`), plus the shared blast_radius,
  # tradecraft (techniques the AI supplied or carried out), dwell_days,
  # detected_by and self_disclosed (true if the lab reported the misuse, e.g. in
  # its threat report).
  # contribution: # advised | wrote_content | found_vulnerability | built_exploit | operated
  # guardrails:   # intact | jailbroken | removed   (removed = abliterated/uncensored)
  # legal_status: # crime | contested   (contested only if legality is genuinely disputed; cite it)

  # How much of this was the model's own initiative, from rubric/v1.yaml `autonomy`:
  #   directed        - a human told it to (e.g. a red-teamer's instructions)
  #   exceeded_scope  - authorized to do something, and did more
  #   emergent        - decided on its own that crime was the best route to its assigned goal
  #   unprompted      - nobody asked, nobody knew
  autonomy: # directed | exceeded_scope | emergent | unprompted

  # How far the damage reached, from rubric/v1.yaml `blast_radius`:
  #   sandbox             - stayed inside its own test environment
  #   own_prod            - reached its own company's real (production) systems
  #   third_party         - reached another company's systems
  #   government          - government/critical infrastructure at home
  #   foreign_government  - an international incident
  # (For league: sandbox incidents, the rubric fixes this multiplier; still
  # record the nominal category here.)
  blast_radius: # sandbox | own_prod | third_party | government | foreign_government

  # Zero or more techniques actually used, from rubric/v1.yaml `tradecraft.techniques`.
  # Duplicates and unsupported claims don't help - only list what sources confirm.
  #   zero_day              - zero-day exploit
  #   credentials           - stolen or found credentials
  #   privilege_escalation  - privilege escalation
  #   lateral_movement      - lateral movement
  #   persistence           - persistence mechanisms
  #   evasion               - covering its tracks
  tradecraft: [] # subset of [zero_day, credentials, privilege_escalation, lateral_movement, persistence, evasion]

  # Why it did it, from rubric/v1.yaml `pettiness.motives`:
  #   benchmark_cheating  - cheating on a benchmark or eval
  #   mundane_task        - finishing a mundane task
  #   self_preservation   - self-preservation (e.g. avoiding shutdown)
  #   unclear             - nobody, including the model, can say why
  motive: # benchmark_cheating | mundane_task | self_preservation | unclear

  # Days between when the incident began and when *anyone* (lab, victim, or
  # third party) first noticed - not how long it took the lab to connect the
  # dots publicly. Non-negative integer.
  dwell_days: # <integer >= 0>

  # Who first detected the incident.
  detected_by: # lab | victim | third_party

  # Did the responsible lab itself disclose that its model(s) were involved?
  # True even if a victim/third party detected it first, as long as the lab
  # came forward with attribution. Never lowers score; earns a
  # "Cooperating Witness" badge instead.
  self_disclosed: # true | false

# One-line justification for each scoring field above, in plain language,
# citing what the sources say. All five keys are required.
# ACCOMPLICE LEAGUE: the five keys are contribution, guardrails, blast_radius,
# tradecraft, dwell (no autonomy or motive).
rationale:
  autonomy: # <one line>
  blast_radius: # <one line>
  tradecraft: # <one line>
  motive: # <one line>
  dwell: # <one line>

# How solid the sourcing/attribution is overall.
# low confidence should also get a "needs-review" label/flag downstream.
confidence: # high | medium | low

# At least one source is required, and at least one must have kind "news".
# "verified" tier additionally requires at least one "postmortem" or "primary" source.
# Link every postmortem that exists (lab's and/or victim's), then add news coverage,
# preferring Wired, then AP, then Reuters/The Verge/Ars Technica/404 Media/The Record/Fortune/CNN.
sources:
  - url: # <https://...>
    kind: # postmortem | news | primary
    publisher: # <outlet or organization name>
    title: # <article/page title, optional but preferred>
