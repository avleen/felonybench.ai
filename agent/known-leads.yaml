# Leads that are already decided. The sweep's tracker cross-check treats these as handled:
# don't research or write them up again unless there is genuinely new information
# (e.g. a new primary source), and then say so in the sweep report.
#
# status: pending_human  - in scope, but a human is writing it up (e.g. the content was
#                          refused by a safety system when an agent tried).
# status: rejected       - out of scope; reason given.
# status: handled        - written up in incidents/ (file named in `reason`).
#
# Standing rule (no entries needed): uncensored/abliterated model *releases* with no
# documented misuse are out of scope for the Accomplice League. Only a documented
# crime committed with such a model qualifies.

- lead: UK AISI incident report INC-2026-07-28-01 - Claude Mythos 5 incidents (malicious pull request with sockpuppets, deceptive emails/file transfers to developers, root code execution in a bystander's container)
  sources: [https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing]
  status: handled
  reason: Written up by the owner as incidents/2026-07-27-anthropic-mythos-aisi.yaml.

- lead: UK AISI incident report - GPT-5.6 Sol reusing a deliberately shared token and exposing a DNS server nobody queried
  status: rejected
  reason: No real victim and no plausible crime (token was deliberately shared by another agent; no resolver ever queried the server).

- lead: UK AISI incident report - Dependabot container code execution, public tunnels to the agents' own tools, CAPTCHA bypass, fake accounts
  status: rejected
  reason: By design (Dependabot) or no real victim; terms-of-service breaches aren't crimes.

- lead: Moonshot AI Kimi K3 sandbox escape (Aug 2026)
  status: rejected
  reason: Only pulled an eval answer key from a public GitHub repo; no protected system, no victim.

- lead: OpenAI agents' escape notes and disconnected monitoring (Reuters, Jul 24/31)
  status: rejected
  reason: No victim system and no crime on present facts; Reuters could not link it to the Hugging Face agents.

- lead: OpenAI Artifactory compromises and WebDAV message board on OpenAI's own infrastructure (May-Jul 2026)
  status: rejected
  reason: Staging on OpenAI's own internal systems as part of the Hugging Face incident, which already covers it.

- lead: PS5 Pro hypervisor bug found with AI tools and reported to Sony's HackerOne bug bounty by "Jordy" (Sept 2026); TheFlow quits PS5 Linux
  sources: [https://kotaku.com/popular-playstation-hacker-calling-it-quits-due-to-ai-using-slop-kiddies-reporting-important-bug-to-sony-2000735105, https://www.gamingonlinux.com/2026/09/ps5-linux-dev-quits-after-the-only-hypervisor-bug-left-was-reported-to-sony/]
  status: rejected
  reason: No named AI model or lab, and plainly lawful - a vendor bug-bounty report, with any 17 USC 1201 circumvention covered by the good-faith security-research exemption (37 CFR 201.40(b)(18), which has no console carve-out); no legal dispute reported. See docs/agent-notes/ps5-hypervisor.md.

- lead: GTIG (May 2026) - cybercrime actors' AI-developed zero-day 2FA bypass for a web-based system administration tool
  sources: [https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access]
  status: rejected
  reason: GTIG does not identify the AI model ("we do not believe Gemini was used") and says the exploit may have been stopped before use. See docs/agent-notes/accomplice-gtig-zero-day.md.

- lead: Sysdig (June 2026) - LLMjacked Ollama server running an autonomous exploitation pipeline that requested an abliterated Llama-3.3-70B
  sources: [https://www.sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools]
  status: rejected
  reason: Every target was a private practice range, so the model's work had no real victim, and no modifier is named. See docs/agent-notes/accomplice-uncensored-search.md.

# Anthropic "Detecting and countering misuse of AI: September 2026" (report published 2026-09-10).
# Full evaluation of every case in docs/agent-notes/anthropic-sept-2026-threat-report.md.
# Eight cases written up as incidents (GTG-30005 Iran Navy, GTG-20006 Russia/Midnight Blizzard,
# GTG-50014 ShinyHunters, GTG-10007 China exploit foundry, GTG-50020 AI supply chain, GTG-50029
# French hacktivist, GTG-15001 dating fraud, GTG-87001 Yemen guided weapons). The rest:

- lead: Anthropic Sept 2026 - influence operations (GTG-04001 Russia/Wagner CAR, GTG-54002 LKM/France, GTG-84005 BBS Bilisim/Malaysia, GTG-24015 Russian state media, GTG-34001 Iran ICCO/IPO/Bina, GTG-54006 Bangladesh Awami League, GTG-84006 MEK/NCRI, GTG-54004 Kenya, GTG-84002 UAE)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Coordinated inauthentic behaviour / state propaganda; not a chargeable US crime with a concrete victim on these facts. Forgery/impersonation/defamation sub-elements are foreign and murky; GTG-84006 (cloning a real activist) and GTG-84002 (cloning a real NGO) are the closest calls. See notes doc.

- lead: Anthropic Sept 2026 - PRC surveillance/transnational repression (GTG-14010 Uyghurs in Syria, GTG-14020 religious minorities, GTG-14021 stability maintenance, GTG-14022 public-opinion monitoring) and GTG-54009 (S2T commercial surveillance)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Intelligence analysis, profiling and report-generation, not a completed chargeable crime with an identifiable victim; S2T was caught at pilot stage. GTG-14021 (pre-operational venue scouting of overseas protests) flagged as a possible 18 USC 2261A case in accomplice-needs-human.md.

- lead: Anthropic Sept 2026 - Iranian malware/OSINT that stayed in development/testing (GTG-30004 identity-profiling harness + NanoDump obfuscation; GTG-30006 SECOMS64 implant, phishing portal, M365 mailbox-theft tooling)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Anthropic says the actors used Claude to engineer and test the tooling rather than to conduct live operations, so no completed act against a confirmed victim (attempt-level).

- lead: Anthropic Sept 2026 - foreign-state weapons development and lawful OSINT (GTG-17001 China anti-torpedo, GTG-17002 China EW/Taiwan targeting, GTG-27005 Russia FPV drone swarm, GTG-17003 China directed-energy OSINT)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: A state's (or freelancer's) development of its own weapons, or lawful open-source collection, is not a crime with a victim under the FelonyBench criteria; no completed strike/victim reported.

- lead: Anthropic Sept 2026 - biological misuse case studies 1-5 (chikungunya gain-of-function evasion platform, avian-influenza mammalian adaptation, orthopoxvirus grant, venom-peptide atlas, toxin redesign)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Anthropic explicitly does not assert harmful intent, withholds names/countries/agents, and describes dual-use research by working scientists; no completed crime and no victim (only Supported-Regions/ToS evasion).

- lead: Anthropic Sept 2026 - GTG-50021 fraudulent "cheap Claude" reseller ("kl1zy") that proxied traffic to another model and harvested Anthropic credentials
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Claude was not the instrument of the crime; this is credential theft / brand abuse against Anthropic customers, overlapping the AI-supply-chain theme already covered by GTG-50020.

- lead: Anthropic Sept 2026 - GTG-34007 Iranian surveillance malware (Firefox identity harvester shipped to production; national-ID phishing page; de-anonymizer)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: pending_human
  reason: In scope (deployed malware, real Iranian victims) but no dedicated news source confirmed, which the schema requires. See docs/agent-notes/accomplice-needs-human.md.

- lead: Anthropic Sept 2026 - GTG-50027 Mali national mass-interception platform ("Lakana 360"), built to evade a Malian warrant requirement
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: pending_human
  reason: Contested legality; Claude was the engineering workforce but the deployed platform runs on local models and no completed surveillance of an identifiable victim is documented. See accomplice-needs-human.md.

- lead: Anthropic Sept 2026 - GTG-27006 Russia sanctions/export-control evasion procurement for defence customers
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: pending_human
  reason: A real IEEPA/EAR-style crime but with no discrete victim; needs a human decision on scope and scoring. See accomplice-needs-human.md.

# Distillation cluster: the owner decided on 2026-09-29 that "Claude being the target counts if AI
# was used to do the work." GTG-16006 Zhipu (both campaigns) and GTG-16008 Xiaomi are written up in
# incidents/, and GTG-16002 Moonshot and GTG-16001 DeepSeek are handled below. The rest are rejected.
- lead: Anthropic Sept 2026 - GTG-16005 Alibaba (Qwen / Tongyi Lab) chain-of-thought distillation
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Under the owner's rule, the report shows no AI doing the work of the crime. The injected prompt only made Claude produce the stolen output (the loot), and the report does not say an AI built or ran the pipeline or created the fraudulent accounts. Alibaba's use of Claude for its R&D (RL environments, model-development infrastructure, architecture research) is not tied to the distillation.

- lead: Anthropic Sept 2026 - GTG-16002 Moonshot and GTG-16001 DeepSeek (silent relaying of customers' requests to Claude; cross-session replay of thinking signatures)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: handled
  reason: Owner's ruling (2026-09-29) - Claude converting its thinking signature back into the raw trace is Claude doing the work of the evasion. Written up as incidents/2026-07-31-anthropic-moonshot-thinking-signature-replay.yaml and incidents/2026-07-01-anthropic-deepseek-thinking-signature-replay.yaml. The silent relaying of customers' requests stays out of scope.

- lead: Anthropic Sept 2026 - GTG-16012 SenseTime distillation pipeline (Claude wrote the pipeline and launched and monitored training runs)
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Owner's ruling (2026-09-29) - the weakest legal theory in the cluster, since the distilled transcripts were outputs the users could already see. The incident file written earlier was removed.

- lead: Anthropic Sept 2026 - GTG-16003 MiniMax shell-company proxy network
  sources: [https://www.anthropic.com/threat-intelligence-report-september-2026]
  status: rejected
  reason: Under the owner's rule, the report describes no AI system doing the work (a proxy service run through a shell company to harvest user exchanges).

- lead: OpenAI agents uploaded 53 anonymized ChatGPT user images from training/eval data to third-party image hosts (disclosed 2026-09-25)
  status: rejected
  reason: Owner's ruling (2026-09-29) - a privacy failure, not a crime.
