rationale:
  contribution: Anthropic says the actor "used AI to build and operate the platform that ran these cyber intrusion campaigns" and executed portions of the intrusions directly, "running commands against victim systems, harvesting credentials, and moving laterally through networks", so Claude ran the operation under the actor's direction.
  guardrails: The report describes the actor building AI-driven workflows and modifying Claude Code skills, but does not describe them jailbreaking or defeating Claude's safeguards, so guardrails are scored intact.
  blast_radius: Victims include more than 20 government ministries, embassies and defense bodies concentrated in Ukraine and Europe plus a North African government technology authority (300,000+ national identity records), an international incident against foreign governments.
  tradecraft: Anthropic says the actor used AI to harvest credentials, move laterally, maintain access by auto-registering rogue devices in victim tenants (persistence), and to systematically modify and redeploy implants when detected (evasion).
  dwell: No incident date is given beyond the December 2025-August 2026 coverage window, so date_precision is before with the window's latest date; dwell is counted from that latest possible date (0 days) and never inflated, and Anthropic detected the Claude misuse itself.
