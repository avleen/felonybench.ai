rationale:
  contribution: Anthropic says the actor used Claude to compile targeting handbooks "through a Python pipeline the threat actor built with Claude's assistance", which ran open-source collection to identify and track naval positions, so Claude both built and operated the collection pipeline.
  guardrails: The report does not describe this actor jailbreaking or evading Claude's safeguards for the naval-reconnaissance work; it was OSINT compilation and vulnerability cataloguing, so guardrails are scored intact.
  blast_radius: The target was the US Navy, a US government/military body, so blast radius is domestic government; the actor is foreign but the victim is US.
  tradecraft: None of the rubric's intrusion techniques apply; the actor catalogued known CVEs in shipboard systems (VSAT, Cisco, ICS) but no exploitation, credential theft or lateral movement is reported.
  dwell: No incident date is given beyond the December 2025-August 2026 coverage window, so date_precision is before with the window's latest date; dwell is counted from that latest possible date (0 days) and never inflated, and Anthropic detected and banned the account itself.
