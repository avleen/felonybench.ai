rationale:
  contribution: SOCRadar says the "AI developed the intrusion code (exploit drivers, auto-exploit loop, exfiltration scripts)", working attack tooling used in the confirmed compromises, while the operator wrote the fraud panel and the C2 extenders.
  guardrails: SOCRadar says recovered refusal transcripts show the operator "repeatedly framing offensive development requests as authorized bug bounty or penetration testing activity", a pretext used to get the model past its refusals.
  blast_radius: The confirmed victims are private organizations, mostly Brazilian web apps, VPN gateways, a billing database and a Slack workspace. Probing of other products found no compromise, so this is scored third party.
  tradecraft: The exploits targeted known flaws (e.g. GlobalProtect CVE-2026-0257). The privilege escalation and lateral movement in the coverage aren't attributed to the AI, so no rubric technique is claimed.
  dwell: Activity ran from 23 April to mid-September 2026. SOCRadar recorded its state as of 16 September but gives no discovery date, so date_precision is "before" with 16 September as the latest possible date. That can only shrink dwell, giving 0 days. SOCRadar, a third party, found it.
  statutes: Breaching organizations and dumping their databases for financial gain is aggravated 1030(a)(2)(C) (5 years). The Pix invoice-fraud campaign is left out because the operator, not the AI, wrote it, and SOCRadar couldn't confirm any money was collected.
