rationale:
  contribution: CrowdStrike says the operator "instructs Claude Code to compromise a target and assumes the skills will offer sufficient guidance", with no orchestration layer, and that the actor "still used Claude Code to compromise several Indonesian government domains".
  guardrails: CrowdStrike says the operator "periodically had to intervene to overcome the model's safety guardrails", and Cybersecurity Dive quotes the instruction "You find the bypass yourself, don't rely on my help."
  blast_radius: CrowdStrike says Indonesian government domains and "a government domain of another country" (Bangladesh, per Cybersecurity Dive and CRN Asia) were compromised, so this is an attack on foreign governments.
  tradecraft: CrowdStrike and the coverage don't name any specific technique for this actor, so no rubric technique is claimed.
  dwell: CrowdStrike gives only a May to August 2026 window, so date_precision is "before" with 31 August as the latest possible date. CrowdStrike, a third party, documented the activity within that window, so dwell is 0 and isn't inflated.
  statutes: Compromising government and corporate web domains is unauthorized access under 18 USC 1030(a)(2)(C). No data theft, financial motive or loss is reported, so the misdemeanor maximum of 1 year is used.
