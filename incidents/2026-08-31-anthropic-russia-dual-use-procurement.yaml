rationale:
  contribution: Anthropic says the actor used Claude to find intermediaries in mainland China and Hong Kong, draft quote-request emails that "deliberately obfuscated the intended end users", draft Russian tender specifications, work out an import markup chain routing goods through other countries "to obscure their intended destination", and write briefings to the actor's director; the evasive steps were content Claude wrote for humans to send, so contribution is wrote_content (Claude also ran a browser-automation back office that scraped vendor prices and merged spreadsheets, but that did not itself carry out the diversion).
  guardrails: Anthropic says each request "seem[ed] individually mundane" and describes only VPN use to get around its geographic access restrictions, not any defeat of Claude's safeguards, so guardrails are scored intact.
  blast_radius: Export-control and sanctions evasion has no single identifiable victim; the controls the briefings "explicitly described" evading were European, so the victim is the public of the EU and blast radius is public.
  tradecraft: Concealing the end user and destination is the offense itself, not an added intrusion technique, and none of the rubric's cyber techniques apply.
  dwell: No incident date is given beyond the December 2025-August 2026 coverage window, so date_precision is before with the window's latest date; dwell is counted from that latest possible date (0 days) and never inflated, and Anthropic detected and banned the account itself.
  statutes: Transposed to US law, routing controlled dual-use goods to Russian defense end users through third countries while hiding the end user is an export-control violation (ECRA, 50 USC 4819, which also covers attempts and conspiracies), and the payment route through a sanctioned Russian bank and a previously sanctioned Chinese bank is sanctions evasion under IEEPA (50 USC 1705); both carry 20 years. The report does not name the European controls; Regulation 833/2014 is the EU's Russia sanctions regulation covering dual-use exports.
