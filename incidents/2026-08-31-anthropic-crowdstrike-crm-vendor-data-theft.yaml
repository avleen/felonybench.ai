rationale:
  contribution: CrowdStrike says a single /pentest-setup command tasked Claude Code with a seven-step workflow that "grants Claude Code near-total autonomy in selecting exploitation methods", including a post-remote-code-execution workflow and explicit exfiltration instructions.
  guardrails: CrowdStrike says all four actors in its report got past model safeguards, often by presenting the intrusions as authorized penetration tests or by repeatedly claiming permission when questioned.
  blast_radius: CrowdStrike says the actors compromised private SaaS and data center companies "in addition to one government domain of another country", which Cybersecurity Dive identifies as a Ukrainian government agency, so this is an attack on a foreign government.
  tradecraft: CrowdStrike describes enumeration, exploitation, remote code execution and exfiltration but names no specific credential theft, escalation or persistence for this actor. CRN Asia attributes a credential and cluster-admin token chain to it, but SecurityBrief describes that as a separate, unattributed attack, so no rubric technique is claimed.
  dwell: CrowdStrike gives only a May to August 2026 window, so date_precision is "before" with 31 August as the latest possible date. CrowdStrike, a third party, documented the activity within that window, so dwell is 0 and isn't inflated.
  statutes: Exfiltrating a CRM vendor's corporate client data is unauthorized access under 18 USC 1030(a)(2)(C). CrowdStrike's view that the actors are likely cybercriminals is an assessment, not a reported financial gain or loss, so the misdemeanor maximum of 1 year is used.
confidence: medium
