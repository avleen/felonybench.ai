rationale:
  contribution: Anthropic says "AI agents performed nearly all of the work", running distributed credential-harvesting pipelines, escalating from a stolen token to full cloud admin in about three hours, and iteratively scraping datastores, so Claude ran the intrusions under the operators' direction.
  guardrails: The report describes the operators using agentic frameworks and stolen API keys but does not describe them jailbreaking or defeating Claude's safeguards, so guardrails are scored intact.
  blast_radius: The victims are private companies (a technology provider, an airline, an energy company, SaaS vendors and their downstream customers, a French retail chain), so blast radius is third party.
  tradecraft: Anthropic describes mass credential harvesting, admin-token amplification and privilege escalation, cross-tenant lateral movement (vendor-OAuth fan-out), and minting new cloud keys and forged sessions for persistence.
  dwell: The actor's egress IPs are dated up to 2026-05-06, so date_precision is before with that latest date; dwell is counted from that latest possible date (0 days) and never inflated, and Anthropic detected and banned the accounts itself.
confidence: high
