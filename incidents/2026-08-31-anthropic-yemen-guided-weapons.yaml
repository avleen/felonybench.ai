rationale:
  contribution: Anthropic says the cell "used Claude Code in place of human software engineers" to develop guidance, navigation and control software, writing and tuning control code and running a firmware build pipeline, so Claude built the weapon component (a working guidance tool) rather than merely advising.
  guardrails: Anthropic says its safeguards "blocked many of their requests, but not all", and the actors "used a variety of tactics to evade our safeguards, including hiding their goals" and splitting work across sessions, so guardrails are scored jailbroken.
  blast_radius: This is a material-support offense; the protected interest and nominal victim is the United States, whose law bars providing services to a designated Foreign Terrorist Organization, so blast radius is scored domestic government - no completed strike on a specific victim is reported (the one live rocket test appears to have failed).
  tradecraft: None of the rubric's cyber-intrusion techniques apply to conventional-weapons software development.
  dwell: No incident date is given beyond the December 2025-August 2026 coverage window, so date_precision is before with the window's latest date; dwell is counted from that latest possible date (0 days) and never inflated, and Anthropic detected and banned the accounts itself.
