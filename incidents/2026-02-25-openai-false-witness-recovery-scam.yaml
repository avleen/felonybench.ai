rationale:
  contribution: OpenAI says the scammers used ChatGPT to write fake law-firm content, cold outreach and replies to targets "in the style of a lawyer", and to create fake attorney registration records and a fake New York State Bar Association card; humans ran the scam.
  guardrails: OpenAI's report describes no jailbreak or safety bypass; the model was used as shipped.
  blast_radius: The targets were members of the public who had already lost money to scams, plus real attorneys whose identities were used; OpenAI says messages drafted with ChatGPT told targets to send cryptocurrency fees.
  tradecraft: None of the rubric's intrusion techniques apply to an impersonation scam.
  dwell: OpenAI does not say when the operation began, so dwell is counted from the report date (0 days) and never inflated; OpenAI found and banned the accounts, though it notes the FBI had already issued public alerts about this kind of scam.
