  dwell_days: 7
  detected_by: third_party
  self_disclosed: false
rationale:
  contribution: NorForge's Snorre Fagerland told Reuters the hacker "did almost none of the work", giving instructions of under 100 Chinese characters to agents that spent hours probing and breaking into sites unsupervised; NorForge says the agents did the reconnaissance, testing and exploitation.
  guardrails: Neither Reuters nor NorForge reports a jailbreak or a modified model. NorForge notes the setup looked repurposed from an earlier CTF configuration, but doesn't say the model was misled, so guardrails are scored intact.
  blast_radius: The victims are private companies, mostly e-commerce sites; Reuters names Deere, SharkNinja and a website run by a Cummins vendor. No government system is reported.
  tradecraft: NorForge says AIA0001's goal was persistent access and its pipeline had agents plant an "uploader shell" on breached shops, and it confirmed a live uploader shell on a hardware parts vendor's site (persistence). Single exploits are described but none is shown to be a zero-day, and credential use isn't attributed to this cluster specifically.
  dwell: Reuters says the campaign began on 25 September 2026 and that Fagerland found malicious Cairn instances starting around 2 October, so 7 days, detected by a third party (NorForge).
  statutes: Planting uploader shells on more than 100 companies' web servers is intentional damage to the integrity of protected computers under 18 USC 1030(a)(5)(A); damage to 10 or more protected computers in a year supports the ten-year maximum under 1030(c)(4)(B). 1030(a)(2)(C) is left out because Reuters "could not determine" how much data, if any, was taken.
confidence: low
