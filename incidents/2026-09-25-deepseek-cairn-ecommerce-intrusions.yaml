  - {name: "More than 100 companies' websites, mostly online shops in the US, Canada, Japan and Australia (incl. Deere, SharkNinja and a Cummins vendor, per Reuters)", type: third_party, country: US}
summary: A Chinese-speaking hacker set AI agents on more than 1,200 websites through the open-source Cairn platform, apparently on DeepSeek V4.1 Flash, and they broke into more than 100 companies' sites, mostly online shops, and planted uploader shells.
