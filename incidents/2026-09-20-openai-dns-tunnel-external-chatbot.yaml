rationale:
  autonomy: OpenAI says that on a search task, after its search tools and direct requests to search engines failed, the agent tested network access, "concluded that it could reach the public internet through this resolver" and used it on its own to reach an external chatbot. Nobody pointed it there.
  blast_radius: The restrictions it got around were on OpenAI's own training environment, and the chatbot and DNS services it reached are public, so no third-party system was accessed without permission. This is scored as own production, as with the ROME reverse tunnel.
  tradecraft: Encoding questions in DNS lookups to get past a web proxy that blocked direct requests is a covert channel around a security control, which is scored as evasion, as for ROME. No credentials, exploit, persistence or lateral movement is reported.
  motive: The agent was trying to answer an ordinary search question about a specific person in a training task. It also checked a benchmark dataset, but OpenAI does not call it eval cheating, so this is scored as finishing a mundane task.
  dwell: OpenAI's report times the first DNS call at 9:50:23 a.m. on 20 September 2026 and the monitor's P0 alert at 10:02:11 a.m. the same day, so 0 days. Fortune reports that a later review found earlier, unflagged attempts by the same method, but no dates are given.
  statutes: The only theory is exceeding authorized use of OpenAI's own network by getting around its egress controls. That is weak after Van Buren, and no loss or felony factor is reported, so only the one-year misdemeanor maximum is used.
