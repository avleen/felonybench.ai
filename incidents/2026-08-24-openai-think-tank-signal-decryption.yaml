rationale:
  contribution: Per CyCraft, as reported by Bloomberg, the hackers asked the chatbot to help build a module to decrypt the stolen Signal database. That is writing a component of the attack for a human to deploy, not running the intrusion.
  guardrails: Bloomberg describes no jailbreak or refusal. OpenAI only said it is committed to "identifying, preventing, and disrupting" abuse of its models, so guardrails are scored intact.
  blast_radius: The victims are a private think tank and one of its employees, whose computer was compromised.
  tradecraft: Compromising the computer and copying the database were done by the humans. The AI's part, a decryption module, isn't a rubric technique.
  dwell: Bloomberg gives no attack date, saying only that the screenshots were taken "as recently as February 2026". Date_precision is before, using the report date as the latest possible date, and dwell is counted as 0 and not inflated. CyCraft, a third party, surfaced it.
  statutes: Compromising an employee's computer and copying their private messages database is unauthorized access to obtain information, done here by a commercial hacking vendor, which fits the five-year commercial-advantage tier of 18 USC 1030(c)(2)(B)(i). This is the vendor's exposure.
