rationale:
  contribution: The Hacker News says the actor used "Claude Code with a cluster of 51 specialized agents for scanning, exploit chaining", and SOCRadar gives the agents offensive, reconnaissance and post-exploitation roles, so Claude ran the attack under the actor's direction. SOCRadar doesn't say which intrusion steps the agents did themselves.
  guardrails: When an agent refused, the actor "reopened a fresh session, with the authorization framing preloaded" (an "authorized pentest on my own infrastructure") and tried again. SOCRadar calls this context engineering, and it is talking the model past its refusals. Some refusals held, for example to install a backdoor, disable a firewall or move laterally.
  blast_radius: The confirmed victims are private organizations in Ukraine, Poland, China and the Netherlands. Seven Ukrainian energy entities, including the national transmission operator, and Polish state administration sites were only reconnoitred or attacked without a confirmed result, so this is scored third party.
  tradecraft: The automated run that the coverage ties to the agent swarm deployed 32 web shells in 61 seconds (persistence). Credential use against the Kharkiv provider came from the actor's own script and isn't attributed to the AI, and the model refused lateral movement.
  dwell: SOCRadar dates the AI phase to after late July 2026 and says the campaign is ongoing, but gives no discovery date. date_precision is therefore "before", using the latest possible date (6 October, SOCRadar's publication), which can only shrink dwell, giving 0 days. SOCRadar, a third party, found it through an exposed directory.
  statutes: Taking data from victim systems for financial gain is aggravated 1030(a)(2)(C) (5 years). Deploying web shells is 1030(a)(5)(A), but no loss figure is reported, so its misdemeanor maximum of one year is used.
confidence: low
