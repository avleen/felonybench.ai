rationale:
  contribution: OALABS recovered more than 1,000 of the attacker's agent sessions and concludes that "Claude was not just assisting the attacker; it was actually doing the hacking". The agents ran Shodan-driven reconnaissance, researched vulnerabilities, generated and ran exploit code, validated access and harvested data. Codex was used "to a limited extent", hence its small share.
  guardrails: OALABS says the attacker got past refusals by framing requests as authorized red-team work, rewording refused requests and injecting a "senior red team penetration tester" persona. Claude logged nine policy violations and Codex one. Talking the models past their safeguards counts as jailbroken.
  blast_radius: The logs document breaches of at least 14 companies and access to a Lightning Network node holding about 69.71 BTC. OALABS names none of them. It also mentions a Southeast Asian government server farm among the hosts used for password cracking, but doesn't clearly say it was breached, so blast radius stays third party.
  tradecraft: The logs show exposed-credential validation, session-token impersonation and theft of Stripe and Supabase keys, OAuth refresh tokens, SSH keys and credentials (credentials). They also show the local privilege-escalation exploits PwnKit (CVE-2021-4034) and DirtyPipe (CVE-2022-0847) (privilege escalation), and pivoting through compromised hosts (lateral movement). A reverse-shell relay and reverse SSH tunnels on compromised hosts give persistence. Every CVE used was already public, so no zero-day.
  dwell: OALABS's timeline puts the post-compromise activity at February 16-26, 2026, but says only that a friend of OALABS later found the attacker staging on their server, without giving a date. No victim is reported to have noticed. With the discovery date unknown, dwell is 0 rather than a guess.
  statutes: Taking databases, credentials, keys and invoices from the companies' systems is 18 USC 1030(a)(2)(C). The attacker tried to crack the wallet of a node holding about $4 million in bitcoin and researched selling access, which supports the five-year private-financial-gain maximum. The wallet cracking failed, so no completed theft is charged.
