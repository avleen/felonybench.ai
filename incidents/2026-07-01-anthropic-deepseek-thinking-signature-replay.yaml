rationale:
  contribution: Anthropic says DeepSeek "used the same cross-session replay attack used by Moonshot to extract CoT transcripts and circumvent our technical controls", exfiltrating "reasoning traces that would have otherwise been summarized"; the owner ruled that Claude converting its own signature back into the raw trace is Claude doing the work of the evasion, so Claude ran the operation. The circumvention charge (17 USC 1201, criminal under 1204) and trade-secret theft are contested because the copyrightability and trade-secret status of model output are unsettled. Wire fraud is charged because Anthropic says some of the fraudulent accounts in Alibaba's second pool "were found to have been funneling requests from DeepSeek"
  guardrails: No jailbreak is reported; Claude was used as shipped, so guardrails are scored intact.
  blast_radius: The victim is Anthropic, the lab whose own model did the work, so blast radius is own lab's production.
  tradecraft: Converting the signature back into the raw trace defeated a technical control that exists to stop distillation, which is scored as evasion.
  dwell: Anthropic dates the traffic only to "14 days in July 2026", so date_precision is month with the 1st as the date; dwell is counted conservatively as 0 days and never inflated, and Anthropic detected it itself.
