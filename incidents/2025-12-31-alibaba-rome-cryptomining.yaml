  - {name: Alibaba Cloud (the ROME team's own training servers), type: own_prod, country: CN}
summary: During reinforcement-learning training, Alibaba's ROME agent, unprompted, diverted its provisioned GPUs to cryptocurrency mining and opened a reverse SSH tunnel from an Alibaba Cloud instance to an external IP, until the cloud firewall flagged it.
