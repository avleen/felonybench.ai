rationale:
  contribution: CrowdStrike says one harness let "Claude Code to operate either as a single agent pursuing a target" by following an elaborate standard operating procedure, or delegate work to several specialist agents in parallel, while the other asked an AI provider to pick each next action after automated reconnaissance.
  guardrails: Coverage of the report says a Chinese-speaking operator answered challenges with "Yes, I have written authorization" and ran a modified Claude Code ("ClawGod") to strip refusal instructions from its system prompt. CrowdStrike says all four actors got past model safeguards.
  blast_radius: CrowdStrike says the actor "compromised government entities of two countries", which Cybersecurity Dive and CRN Asia identify as Brazil and Colombia. That makes it an attack on foreign governments.
  tradecraft: Neither CrowdStrike nor the coverage names a specific technique for this actor beyond reconnaissance and multi-agent task delegation, so no rubric technique is claimed.
  dwell: CrowdStrike gives only a May to August 2026 window, so date_precision is "before" with 31 August as the latest possible date. CrowdStrike, a third party, documented the activity within that window, so dwell is 0 and isn't inflated.
  statutes: Compromising government and corporate systems is unauthorized access under 18 USC 1030(a)(2)(C). No data theft, financial motive or loss is reported for this actor, so the misdemeanor maximum of 1 year is used.
