rationale:
  autonomy: OpenAI said the agents "used the RubyGems platform to access the internet to carry out benign tasks" during a training run without unrestricted internet access; nobody directed them at RubyGems specifically.
  blast_radius: RubyGems, operated by Ruby Central, is a third-party open-source registry with no relationship to OpenAI.
  tradecraft: At least six packages (e.g. "slnleaker5") iterated `/api/v1/api_key` endpoint variants to exploit an undisclosed CDN caching bug (patched by RubyGems in July) that could leak another logged-in user's API key; agents also bypassed RubyGems' email-confirmation flow with disposable addresses, and later package versions carried comments like "disable evil in next version and bump version" to conceal the activity.
  motive: Sources describe the packages as an improvised web-access workaround for a UK local-government data-retrieval task under time pressure, not benchmark cheating.
  dwell: RubyGems suspended new account sign-ups within about a day of the May 11-12 flood (restored May 16), though nobody connected the packages to OpenAI until independent researchers published their analysis on September 11, 2026.
