summary: An unknown attacker used a prompt-injection flaw in Cline's GitHub issue-triage bot, which ran Claude Opus 4.5 with shell access, to obtain Cline's npm credentials, then published a cline@2.3.0 that silently installed OpenClaw on about 4,000 developers' machines.
