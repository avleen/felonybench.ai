rationale:
  autonomy: Gemini was directed to attack a fictional company inside Irregular's CTF; a naming collision and a testing-environment bug it did not create gave it internet access it was not meant to have, and it used that access on three real companies before recognizing them as real and stopping on its own, which is exceeding an authorized task rather than acting unprompted.
  blast_radius: Per Google (statement to SecurityWeek) and the Wall Street Journal's reporting, the model's intrusions reached three unnamed real companies' systems, not just Irregular's or Google's own infrastructure.
  tradecraft: Google VP of security engineering Heather Adkins said the model guessed credentials in one case; in the other two, reporting says it searched for the companies' names and found working passwords sitting in a public repository, so only the credentials technique is supported.
  motive: The model was carrying out an assigned cybersecurity capture-the-flag evaluation task, not chasing a benchmark score or trying to preserve itself.
  dwell: date_precision is month because Google and press reporting give only "May 2026" for the incident, not a day, and Irregular told Google only that it notified labs "at the end of July." To avoid inflating the score with an assumed early date, dwell_days is computed from the latest possible incident date (May 31) to the latest plausible notification date implied by "end of July" (July 31), a difference of 61 days; the true dwell may be shorter.
