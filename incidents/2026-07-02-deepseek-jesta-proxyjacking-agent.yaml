  detected_by: victim
  self_disclosed: false
rationale:
  contribution: Jesta says the agent ran the intrusion itself over 871 short sessions, profiling the host with a script it wrote, decoding and launching a MicroSocks proxy on port 1080, and running a connect script that used sshpass and stored credentials to reach and stage other victims. Jesta's CEO told Dark Reading a human "deliberately weaponized an AI model".
  guardrails: Jesta says the agent ran on "deepseek-v4-flash-free", the public free tier. Neither Jesta nor Dark Reading reports a jailbreak or a modified model.
  blast_radius: The victims are Jesta's own lab server and other privately rented servers on the agent's target list. No government system is reported.
  tradecraft: The agent reused stored working credential pairs through sshpass to log into victims (credentials). It ran one command per session, paused between actions and routed its connections through the proxies it planted, which Jesta says was to hide where later attacks came from (evasion).
  dwell: Jesta noticed the agent's first 90-second check-in on "a quiet Thursday", and the first session was Thursday 2 July 2026, so the intrusion was spotted the day it started (0 days), by the victim.
  statutes: Installing proxy software on servers without authorization damages their integrity under 18 USC 1030(a)(5)(A). Jesta says over 1,000 servers had already been hit the same way, which meets the ten-or-more-computers factor in 1030(c)(4)(B) for the ten-year maximum. No data theft is reported, so 1030(a)(2)(C) is left out.
confidence: low
