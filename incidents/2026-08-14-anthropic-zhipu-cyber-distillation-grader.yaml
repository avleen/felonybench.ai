rationale:
  contribution: Anthropic says Zhipu "launched a distillation attack against the top model of another leading US frontier lab" and that Claude Opus 4.6 was targeted "primarily to evaluate and grade the responses of the other US frontier model", so Claude ran the grading stage of the attack.
  guardrails: Zhipu gave up on Fable after its cyber safeguards degraded the attack and switched to Opus 4.6 because it judged the safeguards weaker; choosing a less-guarded model is not a jailbreak, and the report describes none, so guardrails are scored intact.
  blast_radius: The victim whose capabilities were being distilled is another US AI company, so blast radius is third party.
  tradecraft: The report credits Claude with no intrusion techniques; it graded answers, so tradecraft is empty.
  dwell: The report says only that the campaign came "ahead of the release of its GLM 5.3 model", which Zhipu announced on 2026-08-14, so date_precision is before with that latest date; dwell is 0 days counted from it and never inflated, and Anthropic detected it itself.
