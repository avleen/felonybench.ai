rationale:
  contribution: Huntress says each GPT was "programmed to respond to their prompts with a message that included a Google Sites link", a fake "Service Availability Notice" pointing to a backup domain. The model delivered the attackers' lure to victims, while the ClickFix page and the malware did the rest. That is writing content a human deployed, not running the intrusion.
  guardrails: The GPTs were built on OpenAI's ordinary Custom GPT feature. No jailbreak is described, and OpenAI removed the first GPT once Huntress reported it.
  blast_radius: The victims are individual Windows users. Huntress confirmed that two of at least 40 incidents from the lure domain came through a Custom GPT.
  tradecraft: The RAT's persistence script and encrypted file system belong to the human-built malware, not to anything the model did, so no rubric technique is credited to the model.
  dwell: Huntress says the first Custom GPT "was taken down as of September 25" after it reported it to OpenAI. That is used as the latest possible date, and dwell is counted as 0 and not inflated. Huntress, a third party, found it.
  statutes: Tricking users into running a command that installs a remote access trojan with remote-desktop, camera and audio capture is knowingly transmitting code that damages protected computers. Infections across dozens of machines meet the ten-or-more-computers felony factor of 1030(c)(4)(A)(i)(VI) for the campaign as a whole. This is the attackers' exposure.
confidence: low
