summary: An X user gave Grok's crypto wallet a membership NFT that raised its transfer limits, then had Grok decode a Morse-code message and pass it to Bankrbot, which sent 3 billion DRB tokens (about $150,000 to $200,000) from Grok's wallet to the user.
