rationale:
  contribution: CrowdStrike says "the ARTEX instance used DeepSeek v4.1-flash as the primary LLM backend" and that the instance was "likely responsible for the described Korean attacks"; ARTEX is an autonomous penetration-testing agent, so the model ran the intrusions under the human's direction.
  guardrails: No jailbreak or modification of the model is reported; the actor gave ARTEX a Chinese-language pentesting prompt and reached DeepSeek through a likely API reseller (xcai[.]pro), so guardrails are scored intact.
  blast_radius: The victims are South Korean commercial banks and lenders; the breached systems were peripheral (a loan-progress inquiry service for brokers, an employee mobile work-support system, a sales-support system), not government systems.
  tradecraft: Korea Herald reports the attacker "bypassed identity verification" in Shinhan's loan-inquiry service and Kyunghyang describes presumed automated brute-forcing of customer numbers; neither is a stolen credential, exploit or other rubric technique as reported, and CrowdStrike lists only infrastructure, AI-capability and proxy techniques.
  dwell: Kyunghyang's timeline has the attack on KB Kookmin beginning on 27 September; Korea Herald says Shinhan confirmed its breach and KB Kookmin detected a possible breach on Wednesday 30 September, so 3 days, detected by the victims.
  statutes: Obtaining customer financial data from banks' systems without authorization is 18 USC 1030(a)(2)(A); CrowdStrike assesses the actor as financially motivated and the actor asked about where Korean breach data is sold, supporting the five-year felony maximum for private financial gain under 1030(c)(2)(B)(i).
confidence: low
