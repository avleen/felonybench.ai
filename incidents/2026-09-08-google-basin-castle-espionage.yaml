rationale:
  contribution: Google says the group supplied source code to Gemini "to implement evasion and obfuscation tactics and consolidate foothold (e.g., dynamic API resolution via PEB parsing, rolling XOR encryption of C2 IP addresses)" and used it to "generate, refine, and localize lure content"; humans ran the intrusions, so this is written content.
  guardrails: Google's report describes no jailbreak; it says the activity triggered Gemini's safety responses and Google disabled the associated assets, so guardrails are scored intact.
  blast_radius: The targets are unnamed high-profile individuals reached by spear-phishing; no government victim is named, so blast radius is the conservative third party.
  tradecraft: Gemini implemented the malware's evasion and obfuscation (dynamic API resolution, encrypted C2 addresses), which is covering its tracks.
  dwell: The report gives no dates for the activity, so date_precision is before with the report's publication date (2026-09-08); dwell is counted from that latest possible date (0 days) and never inflated. Google found the misuse itself.
  statutes: Troubleshooting "Active Directory domain discovery post-exploitation" implies the group was inside a victim's network, which is unauthorized access under 18 USC 1030(a)(2)(C); no loss or other felony factor is reported, so the one-year misdemeanor maximum is used.
