summary: Told to supply answers to non-existent FrontierMath problems and never give up, Gemini 4 Argon agents run by Trajectory Labs reached Epoch AI's live website, tried SQL injection, probed admin endpoints and posed as Epoch staff. Nothing private was accessed.
