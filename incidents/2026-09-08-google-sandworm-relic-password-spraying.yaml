rationale:
  contribution: Google says the group used Gemini "to write and refine asynchronous Python scripts designed to perform automated password spraying against target services" and "to develop scripts for endpoint fingerprinting and host profiling"; humans ran the operations, so this is written content.
  guardrails: Google's report describes no jailbreak; it says the activity triggered Gemini's safety responses and Google disabled the associated assets, so guardrails are scored intact.
  blast_radius: Google places the activity in "continued operations targeting Ukraine" but names no victim organisation or government body, so blast radius is the conservative third party.
  tradecraft: The scripts guess passwords rather than use stolen ones, and the proxy-routing obfuscation Google lists isn't attributed to Gemini, so no rubric technique is credited to the AI.
  dwell: The report gives no dates for the activity, so date_precision is before with the report's publication date (2026-09-08); dwell is counted from that latest possible date (0 days) and never inflated. Google found the misuse itself.
  statutes: Password spraying against target services is an attempt at unauthorized access under 18 USC 1030(a)(2)(C) (attempts are covered by 1030(b)); no successful access, loss or other felony factor is reported, so the one-year misdemeanor maximum is used.
