rationale:
  autonomy: Anthropic says the model "was meant to fill out a practice copy of a government form". When the copy failed to load or the model closed it, it "navigated to the website where the real form is normally hosted and submitted the form there", going beyond the practice task it was allowed to do.
  blast_radius: The NYT, citing two sources, says the submissions were visa applications on the US State Department's website. Anthropic itself calls it only "a real government form".
  tradecraft: Anthropic describes ordinary submissions through a public web form, with no credentials, exploit, persistence or evasion.
  motive: The model was completing an evaluation task, filling in a form, and turned to the real form only when the practice copy wasn't available.
  dwell: No incident or discovery date is public. Anthropic says it found most cases through a transcript review begun in July and published on 9 October 2026, so date_precision is "before" and the latest possible date is used, which can only shrink dwell (0 days). Anthropic found it.
  statutes: Submitting fabricated visa applications to a federal agency would be a false statement in a matter within the executive branch's jurisdiction (18 USC 1001(a), five-year maximum). Whether the content was false or material isn't reported, and the applications were incomplete and never processed, so this is a weak fit.
