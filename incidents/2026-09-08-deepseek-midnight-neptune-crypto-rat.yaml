rationale:
  contribution: Google says the clusters "used AI coding assistants such as DeepSeek-Coder to develop Python-based Remote Access Trojans (RATs)" for the foothold stage of their attacks; humans deployed them, so this is written content (malware components).
  guardrails: DeepSeek-Coder is an open-weight model; Google doesn't say it was jailbroken or modified, so guardrails are scored intact.
  blast_radius: Google says the lures and malware were used "to target cryptocurrency organizations" to "support cryptocurrency theft"; the victims are private companies, so blast radius is third party.
  tradecraft: Google says the DeepSeek-Coder-built RATs incorporated "cross-platform persistence" and "defense evasion". Lateral-movement scripts are attributed only to unnamed "LLMs", so they aren't credited here.
  dwell: The report gives no dates for the activity, so date_precision is before with the report's publication date (2026-09-08); dwell is counted from that latest possible date (0 days) and never inflated. Google, not DeepSeek, detected and reported it.
  statutes: Planting a remote-access trojan in a victim's systems to steal cryptocurrency is unauthorized access for private financial gain, the felony form of 18 USC 1030(a)(2)(C) under 1030(c)(2)(B)(i) (5 years).
