rationale:
  contribution: Cleafy says the console asks Gemini to extract bank balances from all stolen SMS and score each device, "deciding which victims are worth an operator's time", and the malware sends the live screen tree to Gemini Flash models from the phone and receives the coordinates to tap; Gemini runs live inside the attack loop, though the malware performs the taps.
  guardrails: Operators use ordinary Google AI Studio API keys; no jailbreak or safety bypass is described.
  blast_radius: The victims are members of the public whose phones were infected via malvertising and smishing.
  tradecraft: The credential and SMS theft is done by the malware itself; Gemini's jobs (victim ranking and screen navigation) aren't rubric techniques.
  dwell: Cleafy doesn't say when the Gemini features were first used, only that the console has had nearly 100 deployments since April 2026 and that V6 consolidated its AI on Gemini, so date_precision is before, using the report date (2026-09-28); dwell is counted from that latest possible date (0 days) and never inflated. Cleafy, a third party, found it.
  statutes: Infecting phones to take passwords, contacts and text messages for financial gain is unauthorized access aggravated by commercial purpose under 18 USC 1030(a)(2)(C) and (c)(2)(B)(i); no completed bank fraud amounts are reported, so no fraud statute is added.
