rationale:
  contribution: OpenAI says the network used ChatGPT to write the dating-service ads and to "generate and translate emotionally manipulative messages pressuring targets" into escalating payments, and blended human operators with "API-powered automation" for its chatbot receptionist; humans ran the scam, so this is scored as writing the content.
  guardrails: OpenAI's report describes no jailbreak or safety bypass; the model was used as shipped.
  blast_radius: The targets were members of the public in Indonesia, reached through paid social media ads and Telegram; OpenAI quotes a letter to a victim demanding Rp 20,500,000.
  tradecraft: None of the rubric's intrusion techniques apply to a romance and task scam.
  dwell: OpenAI does not say when the operation began, so dwell is counted from the report date (0 days) and never inflated; OpenAI found and banned the accounts itself.
