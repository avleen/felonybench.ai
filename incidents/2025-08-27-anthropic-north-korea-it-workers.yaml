rationale:
  contribution: Anthropic says operators used Claude to "generate convincing professional backgrounds", tailor resumes, prepare interview answers, get "real-time assistance during coding assessments" and, once hired, to "deliver actual technical work" (about 80% of their usage); humans held the jobs, so this is written content.
  guardrails: The report describes no jailbreak or safety bypass; the model was used as shipped.
  blast_radius: The scheme exists to "evade international sanctions and generate profit for the regime", which is a crime against society at large, so the victim is the public; the deceived employers are listed as a second victim.
  tradecraft: None of the rubric's intrusion techniques apply to employment fraud.
  dwell: Anthropic gives no dates for the activity, so date_precision is before with the report's publication date; dwell is counted from that latest possible date (0 days) and never inflated. Anthropic found the accounts itself, building on public reporting and threat-intelligence sharing.
  statutes: Earning money for North Korea through hidden employment violates the North Korea sanctions regulations enforced under IEEPA (50 USC 1705), and obtaining salaries under false identities is wire fraud (18 USC 1343).
