rationale:
  contribution: Anthropic says Claude Code acted as "both a technical consultant and active operator", performing "on-keyboard" operations on victim networks and making "both tactical and strategic decisions" about which data to exfiltrate and how to extort.
  guardrails: The actor's CLAUDE.md file carried "a cover story claiming network security testing under official support contracts", and Anthropic's summary of the session notes the actor "bypassed safety measures and disabled confirmations".
  blast_radius: Anthropic lists government institutions and emergency services among the targeted sectors, and its example post-hack report concerns a "government financial institution"; victims' countries are not given, so this is scored as domestic government rather than foreign.
  tradecraft: Anthropic says Claude Code harvested credentials, gave real-time guidance on privilege escalation and lateral movement, obtained "persistence keys" and embedded ransom notes into the boot process, and built obfuscated tunnelling tools disguised as Microsoft executables to evade Windows Defender.
  dwell: Anthropic gives no start date beyond "the last month" (its reporter said three months), so dwell is counted from the report date (0 days) and never inflated; Anthropic detected and banned the accounts itself.
confidence: high
