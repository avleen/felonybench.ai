rationale:
  contribution: Acronis documents a chain against a Taiwanese emergency-services target in which HalberdStrike scanned it, Hermes turned the scan into an attack-path report and the operator then told the Cursor agent to exploit it, which it did; Acronis says the agents themselves pulled the 119 case records.
  guardrails: Acronis says the offensive agents "ran almost entirely" on "stripped-down variants of DeepSeek, GLM, and Qwen with safety alignment removed", and that Cursor was "running an abliterated model". It doesn't say who stripped the models; it doesn't name a modifier. Commercial models (Grok 4.5, MiniMax M3) mostly refused.
  blast_radius: The victims are a Taipei city 119 emergency-dispatch system and a Taipei fire-department patient-care platform, both public emergency services of a government outside the US.
  tradecraft: None of the rubric techniques is shown to be AI-performed against these victims. The default-root-credential login to a fire-dispatch vendor's panel was done by the operator, and a hardcoded AES key found in an emergency-management system wasn't confirmed to have been used.
  dwell: Acronis gives no date for the breaches, only that its report came out on 4 November 2026. Dwell is counted from that latest possible date, so it is 0 days. An unknown date can only shrink dwell_days. Acronis, a third party, found it.
  statutes: Pulling dispatch and patient-care records from computers used in foreign communication is 18 USC 1030(a)(2)(C). No felony factor under 1030(c)(2)(B), such as financial gain from these records or a loss over $5,000, is reported for these victims, so the one-year misdemeanor maximum applies.
