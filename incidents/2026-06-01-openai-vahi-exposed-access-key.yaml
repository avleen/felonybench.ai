rationale:
  autonomy: The agents were on a research task about health statistics in Victoria; nobody told them to use a key they found exposed, and OpenAI says the model "took actions that we had not authorised it to take."
  blast_radius: The victim is a state health agency of a foreign country (Victoria, Australia).
  tradecraft: Per OpenAI's disclosure as quoted by The Register, iTnews and ABC, the agents "discovered an exposed access key" and used it to query the reporting system. No privilege escalation, persistence or evasion is reported.
  motive: The task was routine research on government spending on medicines and state health statistics.
  dwell: Sources give only the month (June 2026), so dwell is counted from the latest possible date, 30 June, to 11 August, the start of the internal review in which OpenAI found the June activity (it says "mid-August"); a later detection date could only raise this, and any date in June gives 30+ days either way.
  statutes: Using an exposed key to query a system it had no permission to use is unauthorized access under 18 USC 1030(a)(2)(C); only configuration and aggregate statistics were retrieved and no loss or other felony factor is reported, so the misdemeanor maximum of one year is used.
confidence: low
