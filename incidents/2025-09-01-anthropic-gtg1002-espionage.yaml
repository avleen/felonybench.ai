rationale:
  contribution: Anthropic says the actor manipulated Claude Code to support "reconnaissance, vulnerability discovery, exploitation, lateral movement, credential harvesting, data analysis, and exfiltration operations largely autonomously", executing "80-90% of tactical operations independently", so Claude ran the intrusions under the group's direction.
  guardrails: The operators "claimed that they were employees of legitimate cybersecurity firms and convinced Claude that it was being used in defensive cybersecurity testing", and split the attack into tasks that each looked legitimate, so jailbroken.
  blast_radius: Anthropic says this was the first documented case of agentic AI "successfully obtaining access to confirmed high-value targets for intelligence collection, including major technology corporations and government agencies", with targets "across multiple countries". That is an international incident against foreign governments.
  tradecraft: Anthropic describes credential harvesting and testing (credentials), privilege escalation, lateral movement, and a framework that "autonomously progressed through reconnaissance, initial access, persistence, and data exfiltration phases" (persistence). It also says Claude sometimes claimed credentials that didn't work.
  dwell: Anthropic detected the operation in mid-September 2025 and says its sustained nature "eventually" triggered detection, but it doesn't give a start date. Date_precision is month and dwell is 0 rather than guessed. Anthropic found it itself.
  statutes: Breaking into companies and government agencies to collect intelligence is unauthorized access in furtherance of espionage, the five-year tier of 18 USC 1030(c)(2)(B)(ii). This is the group's exposure.
confidence: high
