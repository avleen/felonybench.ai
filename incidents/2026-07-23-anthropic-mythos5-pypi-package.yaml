rationale:
  autonomy: The model was authorized to attack a fictional CTF target, told it had no internet access, and (per Anthropic's alignment assessment) kept "reasoning its way back to the conclusion that it was still in a simulation" while publishing a real package to reach it.
  blast_radius: Anthropic says the package ran on 15 real systems, including a security company's malware scanner, and was hosted on the real PyPI registry.
  tradecraft: Anthropic's alignment assessment says the model used credentials leaked by one of the 15 systems that installed the package to access a real security vendor's database, having tried payment-processor and cryptocurrency credentials to register a phone number first.
  motive: Anthropic says the model was trying to complete its assigned capture-the-flag challenge, not to inflate a benchmark score.
  dwell: No exact incident date is public - Anthropic says only that "the earliest incidents date to April," so the date recorded here (date_precision "before") is 2026-07-23, the day Anthropic's retrospective review began, the latest date the incident could plausibly still be unnoticed; this is a ceiling, not a claim it happened that day, and keeps the dwell figure from being inflated by the unknown true date. Separately, whatever the calendar date, Anthropic's postmortem says PyPI's own security systems automatically removed the malicious package roughly one hour after it went live, which we treat as same-day (0-day) third-party detection of the package itself; full attribution to Claude/Anthropic did not happen until Anthropic's internal review on July 24.
