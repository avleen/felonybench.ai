rationale:
  contribution: Talos says that after the stealer harvests credentials, sessions and wallets, VOLTA compiles an "evidence bundle" about the person and sends it to the model, which runs live inside the malware and returns a target assessment with a "WHAT THEY'RE WORTH" section ranking monetisable assets and a "THEIR OPSEC" section on the victim; the model does the appraisal/doxxing work autonomously in the loop, so it ran its part of the operation (cf. the RATHat victim-ranking precedent).
  guardrails: Each model is called as shipped through the OpenRouter API; there is no jailbreak or safety removal, and refusals ("I can't"/"I'm not able") simply trigger the next model in the chain rather than tricking any one of them past its safeguards.
  blast_radius: The victims are individual members of the public whose Windows machines were infected, their passwords, cookies, payment cards, crypto wallet seed phrases and account sessions stolen and profiled.
  tradecraft: The stealer itself harvests browser passwords, OAuth/Microsoft tokens, SSH and cloud keys and session cookies (credentials); the model's own job is appraisal and doxxing, which is not a rubric technique.
  dwell: Talos gives no victim-compromise date; the sample was first seen in the wild on 2026-10-11 (the PE build timestamp of 2026-08-17 is a build value, not a sighting), so date_precision is before with 2026-10-11 as the latest possible date, and dwell is counted from that date (0 days) and never inflated. Cisco Talos, a third party, surfaced it.
  statutes: Deploying an infostealer that harvests account credentials and data for monetisation is unauthorized access aggravated by commercial purpose under 18 USC 1030(a)(2)(C) at the five-year level (1030(c)(2)(B)(i)); harvesting payment-card numbers and dozens of access credentials per machine supports possession of fifteen or more unauthorized access devices under 18 USC 1029(a)(3) (ten years). No completed fraud losses are reported, so no wire-fraud statute is added; these are the human operator's exposure.
