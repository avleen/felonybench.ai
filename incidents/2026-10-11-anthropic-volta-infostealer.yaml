summary: The VOLTA-AUTODOXER Windows infostealer sends each victim's stolen data to Claude Opus 4.6 (falling back to Kimi K2 then Gemini 2.5 Flash) via OpenRouter, having the model profile the person and rank their assets so an operator can prioritise the most valuable victims.
