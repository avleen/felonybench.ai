rationale:
  contribution: CrowdStrike says VAPOR PANDA "ran ARTEX primarily with the Chinese-origin DeepSeek LLM". Its planner and worker agents carried out the intrusions, writing web shells, extracting domain administrator passwords and inventorying sensor coverage, while the human operator intervened "only to steer the agents at decision points".
  guardrails: CrowdStrike describes no jailbreak or safety removal. The model was called through the ARTEX framework as shipped.
  blast_radius: CrowdStrike says the adversary "compromised a Middle East-based interior ministry", deployed BLOODALCHEMY at a Latin American foreign ministry, describes "extensive intrusions" at two Latin American foreign ministries, and says it compromised telecoms in the US, Belgium and the Philippines. That makes it an international incident against foreign governments.
  tradecraft: CrowdStrike documents LAPS password reads, a forged admin token from an unrotated 2022 directory export and password spraying (credentials), recovery of an enterprise admin account and resource-based constrained delegation (privilege escalation), host reconnaissance and lateral movement, JSP and PHP web shells plus the BLOODALCHEMY backdoor (persistence), and a renamed binary posing as svchost.exe and a hunt for hosts without its Falcon sensor (evasion). No zero-day is reported.
  dwell: The activity began on October 17, 2026, and CrowdStrike, a third party, described it within an 11-day window. No victim's compromise date is given separately, so dwell is counted as 0 and not inflated.
  statutes: Breaking into telecom networks and government agencies to steal data is unauthorized access, here in furtherance of espionage, the five-year tier of 18 USC 1030(c)(2)(B)(ii). Planting web shells and a backdoor across nine organizations' systems impairs the integrity of ten or more protected computers in a year, a felony factor under 1030(c)(4)(A)(i)(VI) for 1030(a)(5)(A). These are the human operators' exposure.
