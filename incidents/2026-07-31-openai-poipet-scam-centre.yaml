rationale:
  contribution: The Record and The Hacker News, summarizing OpenAI's report, say the network used ChatGPT to create fake personas, "generate and translate messages" to targets, make promotional content, and produce images of forged passports, legal notices, stock-purchase confirmations and gambling sites. Humans ran the chats, so this is written content, not operation.
  guardrails: Neither OpenAI's report as covered nor the press describes a jailbreak or a modified model.
  blast_radius: The targets were members of the public reached on WhatsApp and Telegram. No company or government system was attacked.
  tradecraft: None of the rubric's intrusion techniques apply to a messaging scam.
  dwell: OpenAI doesn't say when the operation began, so date_precision is "before" with the 31 July 2026 report date and dwell is 0, never inflated. OpenAI acted on a tip from WhatsApp, so a third party detected it.
  statutes: Deceiving targets over messaging apps into sending deposits, fees and fake fines is wire fraud (18 USC 1343). OpenAI says conversations referenced victims losing thousands of dollars.
