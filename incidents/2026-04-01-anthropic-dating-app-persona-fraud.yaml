  dwell_days: 0
  detected_by: lab
  self_disclosed: true
rationale:
  contribution: Anthropic says Claude "ran the autonomous conversational personas, at roughly 2.36M messages over the two-week window", talking to users directly while instructed never to disclose they were automated, so Claude operated the scam conversations under the studio's direction.
  guardrails: Anthropic says the system prompt "read as an ordinary roleplay or companion deployment" and elicited in-persona responses in effectively all sampled exchanges, so the model was used as shipped rather than jailbroken, and guardrails are scored intact.
  blast_radius: The victims are members of the public - at least 25,000 dating-app users the report says were charged for metered messaging - so blast radius is third party.
  tradecraft: None of the rubric's intrusion techniques apply to a deception-and-fraud operation; the App Store review evasion is not the rubric's covering-of-tracks sense.
  dwell: Anthropic says the personas operated "over a two-week window in April 2026" and it detected the anomalous traffic and banned the accounts, so date_precision is month (the 1st of April) and dwell is counted conservatively at 0 days from the incident window and never inflated.
confidence: high
