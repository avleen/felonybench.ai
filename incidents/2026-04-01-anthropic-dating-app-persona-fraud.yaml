org: Anthropic
human_actor: A China-based app studio (tracked by Anthropic as GTG-15001) that ran a network of more than 20 deceptive dating apps advertised as fully human
models:
  - {name: "Undisclosed model", codename: null, family: null, share: 1}
victims:
  - {name: "At least 25,000 dating-app users (targeted primarily in the US)", type: third_party, country: "US"}
summary: A China-based studio used Claude to run more than 4,700 AI personas across 20+ dating apps advertised as human, exchanging 2.36 million messages with at least 25,000 users to drive paid engagement.
statutes:
  - {code: "18 USC 1343", max_years: 20}
foreign_laws: []
scoring:
  contribution: operated
  guardrails: intact
