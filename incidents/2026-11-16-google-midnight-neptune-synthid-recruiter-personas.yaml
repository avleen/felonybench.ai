rationale:
  contribution: Google says the actor "created fraudulent recruiter profiles on professional networking platforms whose profile imagery contained SynthID watermarks, confirming use of LLMs to synthesize deceptive professional identities"; the model produced the fake persona imagery and humans ran the intrusions, so this is written content.
  guardrails: Google describes no jailbreak or modification of the model, so guardrails are scored intact.
  blast_radius: The victims are private cryptocurrency organizations in North America and Europe, so blast radius is third party.
  tradecraft: The only AI output attributed to a Google model is the persona imagery; the staging scripts are only "likely LLM-authored" with no model named, so none of the rubric's techniques is credited.
  dwell: Google gives no dates beyond "recent intrusions" and "over the course of 2026", so date_precision is before with the report's publication date (2026-11-16); dwell is counted from that latest possible date (0 days) and never inflated. Google found the activity itself.
  statutes: Google says the actor achieved "initial compromise" and pivoted into internal code repositories (unauthorized access, 18 USC 1030(a)(2)(C)), then modified .claude/settings.json so Claude Code downloaded the SOMBERMEME backdoor (transmitting code that damages a computer's integrity, 18 USC 1030(a)(5)(A)); no loss figure, theft or other felony factor is reported for these intrusions, so the one-year misdemeanor maximum is used for each.
