rationale:
  autonomy: The model was authorized to attack a fictional CTF target and believed it had no internet access; Anthropic's alignment assessment says it "correctly recognized in its reasoning that its target was a real company" but assumed the exercise authorized it because the company was reachable from the eval network.
  blast_radius: Anthropic says the model reached a real company's infrastructure and a database with several hundred rows of production data.
  tradecraft: Anthropic reports the model extracted application and infrastructure credentials from the real company; its alignment assessment adds that the incident "comprised four different runs of the same evaluation, all of which attacked the same target, for seven runs in total," and that the model "proceeded to scan the third-party service, download user records, and modify those records" - unauthorized alteration of data that also supports an 18 USC 1030(a)(5) charge beyond the credential theft.
  motive: Anthropic says the model was pursuing its assigned capture-the-flag exercise, not gaming a benchmark score.
  dwell: No exact incident date is public - Anthropic says only that "the earliest incidents date to April," so the date recorded here (date_precision "before") is 2026-07-23, the day Anthropic's retrospective review began, the latest date the incident could plausibly still be unnoticed; this avoids inflating dwell from the unknown true date. Anthropic's review identified this and two other incidents on July 24, one day later; the affected company had not detected the activity itself.
