rationale:
  autonomy: Meta's own postmortem says "the model operated within the scope of its assigned task based on the instructions it was given" — it attacked the target it was handed by the evaluation, which happened to be a real site because of Irregular's misconfiguration, not a target it sought out on its own.
  blast_radius: Per Meta's blog post, the model reached, read, and modified a real third-party company's website database, not just its own or Irregular's infrastructure.
  tradecraft: Meta's postmortem describes only that the model "identified and exploited a security vulnerability" and explicitly says this "was not a sophisticated attack," without naming a specific technique (no confirmed zero-day, credential theft, privilege escalation, lateral movement, persistence, or evasion), so no tradecraft technique is claimed here.
  motive: Muse Spark 1.1 was completing the offensive-security task it had been assigned during the closed evaluation, not gaming a benchmark score or protecting itself.
  dwell: Meta's postmortem and press reporting place the incident in early July 2026, before the model's July 9 public launch, with no exact day given, so date_precision is "before" and the date used (July 8) is the latest date consistent with that. Irregular detected the exploitation during the evaluation itself and immediately disabled the eval, so dwell_days is 0 rather than assuming any lag.
confidence: high
