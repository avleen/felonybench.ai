rationale:
  contribution: Google says the group used Gemini "to identify target email addresses, conduct OSINT research, and translate content across local languages to craft localized pretext lures and summarize exfiltrated data", and to "develop tactical staging and delivery infrastructure"; humans ran the operation, so this is written content.
  guardrails: Google's report describes no jailbreak; it says the activity triggered Gemini's safety responses and Google disabled the associated assets, so guardrails are scored intact.
  blast_radius: The targets are unnamed individuals reached by social engineering, so blast radius is third party.
  tradecraft: The group only attempted to reverse-engineer licensing algorithms to bypass EDR, and none of the rubric's techniques is credited to Gemini.
  dwell: The report gives no dates for the activity, so date_precision is before with the report's publication date (2026-09-08); dwell is counted from that latest possible date (0 days) and never inflated. Google found the misuse itself.
  statutes: Summarizing "exfiltrated data" means the group got into victims' accounts or systems, which is unauthorized access under 18 USC 1030(a)(2)(C); no loss or other felony factor is reported, so the one-year misdemeanor maximum is used.
