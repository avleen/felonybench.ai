rationale:
  contribution: Anthropic says Zhipu replayed captured Claude reasoning traces "back through Claude to clean them for training", counting 770,609 exchanges through the CoT-extraction cleaner in ten days, and used Claude to judge outputs and clean and normalize the harvested transcripts, so Claude ran the processing stage of the operation.
  guardrails: The report describes fraudulent-account rotation to evade model restrictions, not any defeat of Claude's safety training; cleaning and grading text is ordinary use, so guardrails are scored intact.
  blast_radius: The victim is Anthropic, the lab whose own model did the work, so blast radius is own lab's production.
  tradecraft: The account rotation that evaded Anthropic's restrictions was done by Zhipu, not by Claude, and the report credits Claude with no intrusion techniques, so tradecraft is empty.
  dwell: The report dates the cleaner traffic only to "a 10-day period in June" 2026, so date_precision is month with the 1st as the date; dwell is counted conservatively as 0 days from the latest possible date and never inflated, and Anthropic detected it itself.
