name: Run FelonyBench agent
description: Run Claude Code against agent/RUNBOOK.md and upload what it wrote. publish-run opens the PRs.
inputs:
  mode:
    description: triage or sweep
    required: true
  max_turns:
    description: Claude Code turn limit
    default: "120"
  model:
    description: Claude model alias to run (e.g. opus, sonnet)
    default: "opus"
  effort:
    description: Reasoning effort (low, medium, high, xhigh, max)
    default: "medium"
  claude_code_oauth_token:
    description: Claude subscription OAuth token (from claude setup-token)
    required: true
  github_token:
    description: Read-only token, used to list PRs. The action stores it where the agent can reach it.
    required: true
runs:
  using: composite
  steps:
    - name: Write run context
      shell: bash
      run: |
        mkdir -p .agent-out
        printf '{"date": "%s", "mode": "%s"}\n' "$(date -u +%F)" "${{ inputs.mode }}" > .agent-out/context.json

    - name: Snapshot open agent PRs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash scripts/pending_prs.sh

    - name: Snapshot closed agent PRs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: python -m scripts.closed_prs

    # pypdf for scripts.pdf_text, which the agent uses to read report PDFs (both modes).
    - name: Install agent tools
      shell: bash
      run: pip install -q -r requirements-agent.txt

    # felonybench.com sits behind a bot checkpoint that only a real browser passes, so the
    # sweep gets prefetched copies of other trackers. Never fails the run: errors are
    # written into the output files for the agent to see.
    - name: Prefetch other trackers
      if: inputs.mode == 'sweep'
      shell: bash
      run: |
        set +e
        python -m playwright install --with-deps chromium \
          || echo "::warning::Playwright install failed; felonybench.com prefetch will record an error"
        python -m scripts.fetch_trackers || echo "::warning::Tracker prefetch failed"
        exit 0

    - name: Claude Code
      uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: |
          Read agent/RUNBOOK.md and follow it exactly. Your mode is ${{ inputs.mode }}.
        claude_args: >-
          --max-turns ${{ inputs.max_turns }}
          --model ${{ inputs.model }}
          --effort ${{ inputs.effort }}
          --permission-mode dontAsk
          --tools "Read,Glob,Grep,Edit,Write,WebFetch,WebSearch,Bash"
          --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit(./incidents/**),Edit(./.agent-out/**),Bash(python -m scripts.pdf_text:*)"
          --disallowedTools "Agent,Read(./.git/**),Read(//proc/**),Read(//home/runner/work/_temp/**)"

    - name: Upload the agent's transcript
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: agent-transcript-${{ github.run_id }}
        path: ${{ runner.temp }}/claude-execution-output.json
        retention-days: 30
        if-no-files-found: ignore

    # Runs even when the agent "fails", so a turn limit doesn't throw away finished incidents.
    - name: Upload the agent's output
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: agent-output-${{ github.run_id }}
        # context.json always exists, so the artifact keeps both directories even with no notes.
        path: |
          incidents/*.yaml
          .agent-out/*.md
          .agent-out/context.json
        retention-days: 30
        if-no-files-found: ignore
        include-hidden-files: true  # .agent-out/ is a dot-directory

    # A sweep that doesn't produce its report didn't finish; fail loudly instead of
    # reporting success.
    - name: Check the sweep finished
      if: inputs.mode == 'sweep'
      shell: bash
      run: |
        if [ ! -s .agent-out/sweep-report.md ]; then
          echo "::error::Sweep ended without writing .agent-out/sweep-report.md"
          exit 1
        fi
