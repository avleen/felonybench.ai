name: Run FelonyBench agent
description: Run Claude Code against agent/RUNBOOK.md, then open one PR per changed incident.
inputs:
  mode:
    description: triage or sweep
    required: true
  max_turns:
    description: Claude Code turn limit
    default: "60"
  model:
    description: Claude model alias to run (e.g. sonnet, opus)
    default: "sonnet"
  claude_code_oauth_token:
    description: Claude subscription OAuth token (from claude setup-token)
    required: true
  github_token:
    description: Token used to fetch branches and open PRs
    required: true
runs:
  using: composite
  steps:
    - name: Write run context
      shell: bash
      run: |
        mkdir -p .agent-out
        printf '{"date": "%s", "mode": "%s"}\n' "$(date -u +%F)" "${{ inputs.mode }}" > .agent-out/context.json

    - name: Snapshot open agent PRs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash scripts/pending_prs.sh

    - name: Claude Code
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: |
          Read agent/RUNBOOK.md and follow it exactly. Your mode is ${{ inputs.mode }}.
        claude_args: >-
          --max-turns ${{ inputs.max_turns }}
          --model ${{ inputs.model }}
          --allowedTools "WebSearch,WebFetch,Read,Glob,Grep,Edit(./incidents/**),Edit(./.agent-out/**)"

    - name: Upload agent transcript and notes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-run-${{ inputs.mode }}-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/claude-execution-output.json
          .agent-out/
        retention-days: 30
        if-no-files-found: ignore

    - name: Open PRs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        git config user.name "felonybench-agent"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        python -m scripts.open_prs
