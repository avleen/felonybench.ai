version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/run-agent
      - /.github/actions/publish-run
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /site
    schedule: {interval: weekly}
    groups:
      site: {patterns: ["*"]}
