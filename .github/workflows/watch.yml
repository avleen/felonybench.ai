name: watch
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read   # PR labels

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_candidates: ${{ steps.rss.outputs.has_candidates }}
      dead_feeds: ${{ steps.rss.outputs.dead_feeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state/seen.json
          key: rss-seen-${{ github.run_id }}
          restore-keys: rss-seen-

      - id: rss
        run: python -m scripts.rss_filter

      # Uploaded before the agent starts, so the agent can't change it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rss-seen-${{ github.run_id }}
          path: .agent-state/seen.json
          retention-days: 1
          include-hidden-files: true  # .agent-state/ is a dot-directory

      - if: steps.rss.outputs.has_candidates == 'true'
        uses: ./.github/actions/run-agent
        with:
          mode: triage
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

  # Runs from a clean checkout with the only write token, so nothing the agent read or wrote
  # can reach it. Runs after a failed agent too: finished incidents still become PRs.
  publish:
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write   # PR labels and failure reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/publish-run
        with:
          agent_result: ${{ needs.agent.result }}
          expect_output: ${{ needs.agent.outputs.has_candidates == 'true' }}
          dead_feeds: ${{ needs.agent.outputs.dead_feeds }}
          github_token: ${{ github.token }}

      # Only remember what we've seen once its PRs exist, so a failed run retries tomorrow.
      # publish-run fails if the agent or publishing did, which skips these.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rss-seen-${{ github.run_id }}
          path: .agent-state
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-state/seen.json
          key: rss-seen-${{ github.run_id }}
