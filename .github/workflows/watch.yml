name: watch
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # PR labels

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v6
        with:
          path: .agent-state/seen.json
          key: rss-seen-${{ github.run_id }}
          restore-keys: rss-seen-

      - id: rss
        run: python -m scripts.rss_filter

      - if: steps.rss.outputs.has_candidates == 'true'
        uses: ./.github/actions/run-agent
        with:
          mode: triage
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      # Only remember what we've seen once the agent has handled it, so a failed run retries tomorrow.
      - uses: actions/cache/save@v6
        if: success()
        with:
          path: .agent-state/seen.json
          key: rss-seen-${{ github.run_id }}

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Agent run failed: ${{ github.workflow }}"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "The scheduled agent run failed: $url. Its transcript and notes are attached to the run as an artifact."
          fi
