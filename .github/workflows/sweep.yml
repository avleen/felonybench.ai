name: sweep
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read   # PR labels

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/run-agent
        with:
          mode: sweep
          max_turns: "300"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

  # Runs from a clean checkout with the only write token, so nothing the agent read or wrote
  # can reach it. Runs after a failed agent too: finished incidents still become PRs.
  publish:
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write   # PR labels and failure reports
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-run
        with:
          agent_result: ${{ needs.agent.result }}
          expect_output: "true"
          github_token: ${{ github.token }}
